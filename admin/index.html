/* =========================================================
   VTS ADMIN MOBILE / RESPONSIVE OVERHAUL
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body.admin-body {
  overflow-x: hidden;
}

/* Mobile menu button */
.mobile-menu {
  display: none;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(7,16,11,.88);
  color: #fff;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
}

/* Sidebar close button */
.sidebar-close {
  display: none;
  position: absolute;
  top: 16px;
  right: 16px;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  color: #fff;
  font-size: 28px;
  line-height: 38px;
  text-align: center;
  cursor: pointer;
  z-index: 20;
}

/* Mobile backdrop */
.admin-mobile-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.58);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 999;
}

.admin-mobile-backdrop.active {
  display: block;
}

/* Make sure sidebar sits above backdrop */
.admin-sidebar {
  z-index: 1000;
}

/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

  .admin-main {
    width: 100%;
    min-width: 0;
  }

  .admin-topbar {
    gap: 14px;
  }

  .stat-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .admin-form-grid {
    grid-template-columns: 1fr;
  }

  .admin-form-grid .span-2 {
    grid-column: auto;
  }

  .settings-cards {
    grid-template-columns: 1fr;
  }
}

   MOBILE
